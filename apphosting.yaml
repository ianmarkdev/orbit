# Firebase App Hosting. Create the secrets once with
#   firebase apphosting:secrets:set career-va-database-url
#   firebase apphosting:secrets:set career-va-session-secret   # e.g. `openssl rand -base64 32`
#   firebase apphosting:secrets:set career-va-actions-key      # another random value
# and grant the backend access when prompted.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Neon pooled connection string for the `career_va` role (db/career_va_role.sql), never the owner.
  - variable: DATABASE_URL
    secret: career-va-database-url
    availability: [RUNTIME]

  # Signs session cookies.
  - variable: SESSION_SECRET
    secret: career-va-session-secret
    availability: [RUNTIME]

  # Server Actions must decrypt across instances and deploys.
  - variable: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    secret: career-va-actions-key
    availability: [BUILD, RUNTIME]

  # Public origin, used in the links returned to Career Clipper.
  - variable: APP_URL
    value: https://REPLACE-ME.hosted.app
    availability: [RUNTIME]
